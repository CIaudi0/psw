services:
  api:
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/shop_production
      FRONTEND_URL: http://localhost:8080
    volumes:
      - uploads:/rails/storage

  web:
    build: ./frontend
    ports:
      - "8080:80"

volumes:
  uploads:
