<mat-toolbar class="app-toolbar">
  <a matIconButton routerLink="/products" aria-label="Catalogo prodotti">
    <mat-icon>storefront</mat-icon>
  </a>

  @if (auth.isVendor()) {
    <a matIconButton routerLink="/vendor/dashboard" aria-label="Aggiungi prodotto">
      <mat-icon>library_add</mat-icon>
    </a>
  }

  <span class="app-title">{{ title() | titlecase }}</span>

  @if (auth.isLoggedIn()) {
    <a matIconButton routerLink="/orders" aria-label="I miei ordini">
      <mat-icon>receipt_long</mat-icon>
    </a>
  }

  <button matIconButton type="button" aria-label="Carrello" (click)="goToCart()">
    <mat-icon aria-hidden="false" [matBadge]="cartService.totalCount()" matBadgeColor="warn"
      [matBadgeHidden]="cartService.totalCount() === 0">shopping_cart</mat-icon>
  </button>

  <button mat-button type="button" (click)="toggleLogin()">
    <mat-icon>{{ auth.isLoggedIn() ? 'logout' : 'login' }}</mat-icon>
    {{ auth.isLoggedIn() ? 'Logout' : 'Login' }}
  </button>
</mat-toolbar>
