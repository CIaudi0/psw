<button mat-stroked-button type="button" [disabled]="page() <= 1" (click)="pageChange.emit(page() - 1)">
  <mat-icon>chevron_left</mat-icon> Precedente
</button>
<span>
  Pagina {{ page() }} di {{ totalPages() }}
  @if (total() !== undefined) {
    ({{ total() }} prodotti)
  }
</span>
<button mat-stroked-button type="button" [disabled]="page() >= totalPages()" (click)="pageChange.emit(page() + 1)">
  Successiva <mat-icon iconPositionEnd>chevron_right</mat-icon>
</button>
