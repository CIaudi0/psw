@switch (state()?.status) {
  @case ('loading') {
    <section class="http-state-loading">
      <mat-progress-spinner mode="indeterminate" diameter="50" aria-label="Caricamento dati"></mat-progress-spinner>
    </section>
  }
  @case ('error') {
    <mat-card class="http-state-error" role="alert" aria-live="polite">
      <mat-card-header>
        <mat-card-title>Errore</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p>{{ state()?.message }}</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button type="button" (click)="onRetry()">Riprova</button>
      </mat-card-actions>
    </mat-card>
  }
  @case ('empty') {
    <p class="empty">{{ emptyMessage() }}</p>
  }
  @default {
    <ng-content></ng-content>
  }
}
